name: Release

# Publishes chonk to PyPI when a v* tag is pushed.
#
# Authentication uses the PYPI_API_TOKEN repository secret, matching how the
# provisa repo publishes. Set it with:
#   gh secret set PYPI_API_TOKEN --repo kenstott/chonk
# Without it the publish step fails; nothing else in the job touches PyPI.
#
# The tag must match the version in pyproject.toml — the job fails loudly rather
# than publishing a version nobody asked for.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Build and check only; do not publish"
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    # Without this the PostgreSQL lane of the backend-parity suite skips, and it
    # has skipped on every release so far. Every parity defect found to date —
    # the documents registry row, the clear() cascade, DuckDB-only SQL on the NER
    # write path — was invisible to a DuckDB-only run. pgvector is what supplies
    # the <=> cosine operator, so the stock postgres image will not do.
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: chonk_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6

      - name: Verify tag matches pyproject version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          tag="${GITHUB_REF_NAME#v}"
          version="$(uv run python -c 'import tomllib,pathlib; print(tomllib.loads(pathlib.Path("pyproject.toml").read_text())["project"]["version"])')"
          if [ "$tag" != "$version" ]; then
            echo "Tag $GITHUB_REF_NAME does not match pyproject version $version" >&2
            exit 1
          fi

      - name: Sync environment
        run: uv sync --all-extras --group dev

      # Several NER tests load this model directly; without it they error rather
      # than skip, so the release gate needs it present.
      - name: Download spaCy model
        run: uv run python -m spacy download en_core_web_sm

      - name: Run tests
        env:
          CHONK_TEST_PG_DSN: postgresql://postgres:postgres@localhost:5432/chonk_test
        run: uv run pytest tests/unit -q

      # A green run proves nothing if the backend lanes quietly skipped.
      - name: Assert the PostgreSQL lane actually ran
        env:
          CHONK_TEST_PG_DSN: postgresql://postgres:postgres@localhost:5432/chonk_test
        run: |
          uv run pytest tests/unit/test_backend_registry_contract.py -q -rs \
            | tee /tmp/contract.txt
          if grep -q "pg: set CHONK_TEST_PG_DSN" /tmp/contract.txt; then
            echo "PostgreSQL lane skipped despite a service container" >&2
            exit 1
          fi

      - name: Build sdist and wheel
        run: uv build

      - name: Check metadata
        run: uvx twine check dist/*

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v') && !inputs.dry_run
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
          password: ${{ secrets.PYPI_API_TOKEN }}
          skip-existing: true
